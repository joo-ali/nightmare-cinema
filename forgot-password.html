<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>
   Forgot Password — Nightmare Cinema
  </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="css/style.css" rel="stylesheet"/>
 </head>
 <body>
  <nav class="navbar nc-navbar">
   <div class="container">
    <a class="navbar-brand" href="index.html">
     <img alt="Nightmare Cinema" class="brand-image" src="assets/brand/nightmare-logo.png"/>
    </a>
    <a class="text-link" href="auth.html">
     Back to sign in
    </a>
   </div>
  </nav>
  <main class="container">
   <div class="auth-shell" style="max-width:900px;">
    <section class="auth-brand">
     <img alt="Nightmare Cinema" src="assets/brand/nightmare-logo.png"/>
     <div>
      <h1>
       Forgot your password?
      </h1>
      <p>
       Enter your account email and we will send you a secure reset link.
      </p>
     </div>
    </section>
    <section class="auth-form-side">
     <h2 class="mb-4">
      Reset password
     </h2>
     <form id="forgotPasswordForm">
      <div class="mb-4">
       <label class="nc-label">
        Email
       </label>
       <input class="form-control nc-form-control" id="forgotEmail" placeholder="name@example.com" required="" type="email"/>
      </div>
      <button class="btn btn-gold w-100" type="submit">
       Send reset link
      </button>
      <p class="mt-3" id="forgotMessage">
      </p>
     </form>
    </section>
   </div>
  </main>
  <script src="js/password.js">
  </script>
 </body>
</html>
