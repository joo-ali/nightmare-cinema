<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>
   Checkout — Nightmare Cinema
  </title>
  <link
    rel="icon"
    type="image/png"
    href="assets/brand/nightmare-logo.png"
  />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="css/style.css" rel="stylesheet"/>
 </head>
 <body>
  <nav class="navbar nc-navbar">
   <div class="container">
    <a class="navbar-brand" href="index.html">
     <img alt="Nightmare Cinema" class="brand-image" src="assets/brand/nightmare-logo.png"/>
    </a>
    <a class="text-link" href="booking.html">
     <i class="bi bi-arrow-left me-1">
     </i>
     Back to seats
    </a>
   </div>
  </nav>
  <header class="page-hero">
   <div class="container">
    <span class="eyebrow">
     Step 3 of 4
    </span>
    <h1>
     Checkout
    </h1>
    <p>
     Review your booking details and confirm your seats.
    </p>
   </div>
  </header>
  <main class="section-space">
   <div class="container checkout-grid">
    <section class="checkout-card">
     <h2>
      Your details
     </h2>
     <form id="checkoutForm">
      <div class="row g-3">
       <div class="col-md-6">
        <label class="nc-label">
         Full name
        </label>
        <input class="form-control nc-form-control" id="fullName" placeholder="Ahmed Mohamed" required=""/>
       </div>
       <div class="col-md-6">
        <label class="nc-label">
         Email
        </label>
        <input class="form-control nc-form-control" id="email" placeholder="name@example.com" required="" type="email"/>
       </div>
       <div class="col-12 mt-4">
        <button class="btn btn-gold w-100" type="submit">
         Pay with Kashier
        </button>
        <p class="mt-3 mb-0 text-center" id="checkoutMessage">
        </p>
       </div>
      </div>
     </form>
    </section>
    <aside class="summary-panel order-card">
     <span class="eyebrow">
      Order summary
     </span>
     <div class="order-movie mt-3">
      <img alt="Movie poster" id="checkoutPoster"/>
      <div>
       <h3 id="checkoutMovie">
       </h3>
       <p id="checkoutCinema">
       </p>
       <p id="checkoutSession">
       </p>
       <p>
        <span id="checkoutExperience">
        </span>
        · Seats
        <span id="checkoutSeats">
        </span>
       </p>
      </div>
     </div>
     <div class="mt-4">
      <div class="d-flex justify-content-between mb-2">
       <span class="text-secondary">
        Subtotal
       </span>
       <strong id="checkoutSubtotal">
       </strong>
      </div>
     </div>
     <div class="summary-total">
      <div>
       <small>
        Total
       </small>
       <div>
        Royal Mall
       </div>
      </div>
      <strong id="checkoutTotal">
      </strong>
     </div>
    </aside>
   </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
  </script>
  <script src="js/common.js"></script>
  <script src="js/booking.js"></script>
 </body>
</html>
