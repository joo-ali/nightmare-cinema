<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>
   Booking Confirmed — Nightmare Cinema
  </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="css/style.css" rel="stylesheet"/>
 </head>
 <body>
  <nav class="navbar nc-navbar">
   <div class="container">
    <a class="navbar-brand" href="index.html">
     <img alt="Nightmare Cinema" class="brand-image" src="assets/brand/nightmare-logo.png"/>
    </a>
   </div>
  </nav>
  <main class="section-space">
   <div class="container success-wrap" id="successTicket">
    <div class="success-header">
     <div class="success-check">
      <i class="bi bi-check-lg">
      </i>
     </div>
     <span class="eyebrow">
      Step 4 of 4
     </span>
     <h1 class="mt-2">
      Booking confirmed
     </h1>
     <p class="text-secondary">
      Your booking has been saved successfully. Keep your booking reference for cinema entry.
     </p>
    </div>
    <div class="ticket-card">
     <div class="ticket-main">
      <div class="ticket-info">
       <span class="eyebrow">
        Nightmare Cinema
       </span>
       <h2 id="successMovie">
       </h2>
       <div class="summary-row">
        <span>
         Session
        </span>
        <strong id="successSession">
        </strong>
       </div>
       <div class="summary-row">
        <span>
         Seats
        </span>
        <strong id="successSeats">
        </strong>
       </div>
       <div class="summary-row">
        <span>
         Reference
        </span>
        <strong class="ticket-code" id="successCode">
        </strong>
       </div>
       <div class="summary-row">
        <span>
         Email
        </span>
        <strong id="successEmail">
        </strong>
       </div>
       <div class="summary-total">
        <div>
         <small>
          Total paid
         </small>
         <div>
          Royal Mall
         </div>
        </div>
        <strong id="successTotal">
        </strong>
       </div>
      </div>
      <div class="ticket-qr">
       <div>
        <div id="qrCode">
        </div>
        <p class="text-center text-secondary small mt-3 mb-0">
         Scan at entry
        </p>
       </div>
      </div>
     </div>
    </div>
    <div class="text-center mt-4">
     <a class="btn btn-gold" href="index.html">
      Back to home
     </a>
    </div>
   </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js">
  </script>
  <script src="js/data.js">
  </script>
  <script src="js/app.js">
  </script>
 </body>
</html>
