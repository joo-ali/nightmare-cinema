<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>
   Reset Password — Nightmare Cinema
  </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="css/style.css" rel="stylesheet"/>
 </head>
 <body>
  <nav class="navbar nc-navbar">
   <div class="container">
    <a class="navbar-brand" href="index.html">
     <img alt="Nightmare Cinema" class="brand-image" src="assets/brand/nightmare-logo.png"/>
    </a>
    <a class="text-link" href="auth.html">
     Sign in
    </a>
   </div>
  </nav>
  <main class="container">
   <div class="auth-shell" style="max-width:900px;">
    <section class="auth-brand">
     <img alt="Nightmare Cinema" src="assets/brand/nightmare-logo.png"/>
     <div>
      <h1>
       Choose a new password.
      </h1>
      <p>
       Your reset link can only be used once and expires after 15 minutes.
      </p>
     </div>
    </section>
    <section class="auth-form-side">
     <h2 class="mb-4">
      New password
     </h2>
     <form id="resetPasswordForm">
      <div class="mb-3">
       <label class="nc-label">
        New password
       </label>
       <input class="form-control nc-form-control" id="newPassword" minlength="6" required="" type="password"/>
      </div>
      <div class="mb-4">
       <label class="nc-label">
        Confirm password
       </label>
       <input class="form-control nc-form-control" id="confirmPassword" minlength="6" required="" type="password"/>
      </div>
      <button class="btn btn-gold w-100" id="resetPasswordButton" type="submit">
       Reset password
      </button>
      <p class="mt-3" id="resetMessage">
      </p>
     </form>
    </section>
   </div>
  </main>
  <script src="js/password.js">
  </script>
 </body>
</html>
