<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>
   Account — Nightmare Cinema
  </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="css/style.css" rel="stylesheet"/>
 </head>
 <body>
  <nav class="navbar nc-navbar">
   <div class="container">
    <a class="navbar-brand" href="index.html">
     <img alt="Nightmare Cinema" class="brand-image" src="assets/brand/nightmare-logo.png"/>
    </a>
    <a class="text-link" href="index.html">
     Back home
    </a>
   </div>
  </nav>
  <main class="container">
   <div class="auth-shell">
    <section class="auth-brand">
     <img alt="Nightmare Cinema" src="assets/brand/nightmare-logo.png"/>
     <div>
      <h1>
       Your movie night starts here.
      </h1>
      <p>
       Create your account, verify your email and start booking your favorite movies at Nightmare Cinema.
      </p>
     </div>
    </section>
    <section class="auth-form-side">
     <div class="auth-tabs">
      <button class="auth-tab active" data-auth-tab="login">
       Sign in
      </button>
      <button class="auth-tab" data-auth-tab="register">
       Create account
      </button>
     </div>
     <div id="loginPanel">
      <h2 class="mb-4">
       Welcome back
      </h2>
      <form id="loginForm">
       <div class="mb-3">
        <label class="nc-label">
         Email
        </label>
        <input class="form-control nc-form-control" id="loginEmail" placeholder="name@example.com" required="" type="email"/>
       </div>
       <div class="mb-2">
        <label class="nc-label">
         Password
        </label>
        <input class="form-control nc-form-control" id="loginPassword" placeholder="••••••••" required="" type="password"/>
       </div>
       <div class="text-end mb-4">
        <a class="text-link small" href="forgot-password.html">
         Forgot password?
        </a>
       </div>
       <button class="btn btn-gold w-100" type="submit">
        Sign in
       </button>
       <p class="mt-3" id="loginMessage">
       </p>
      </form>
     </div>
     <div class="d-none" id="registerPanel">
      <h2 class="mb-4">
       Create account
      </h2>
      <form id="registerForm">
       <div class="mb-3">
        <label class="nc-label">
         Name
        </label>
        <input class="form-control nc-form-control" id="registerName" required="" type="text"/>
       </div>
       <div class="mb-3">
        <label class="nc-label">
         Email
        </label>
        <input class="form-control nc-form-control" id="registerEmail" required="" type="email"/>
       </div>
       <div class="mb-3">
        <label class="nc-label">
         Password
        </label>
        <input class="form-control nc-form-control" id="registerPassword" required="" type="password"/>
       </div>
       <button class="btn btn-gold w-100" type="submit">
        Register
       </button>
       <p class="mt-3" id="registerMessage">
       </p>
      </form>
     </div>
    </section>
   </div>
  </main>
  <script src="js/app.js">
  </script>
  <script src="js/auth.js">
  </script>
 </body>
</html>
