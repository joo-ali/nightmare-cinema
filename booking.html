<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>
   Select Seats — Nightmare Cinema
  </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="css/style.css" rel="stylesheet"/>
 </head>
 <body>
  <nav class="navbar nc-navbar">
   <div class="container">
    <a class="navbar-brand" href="index.html">
     <img alt="Nightmare Cinema" class="brand-image" src="assets/brand/nightmare-logo.png"/>
    </a>
    <a class="text-link" href="movies.html">
     <i class="bi bi-arrow-left me-1">
     </i>
     Change movie
    </a>
   </div>
  </nav>
  <header class="booking-top">
   <div class="container">
    <div class="booking-top-grid">
     <img alt="Movie poster" class="booking-mini-poster" id="bookingPoster"/>
     <div>
      <span class="eyebrow">
       Step 2 of 4 · Seats
      </span>
      <h1 id="bookingMovie">
       Movie
      </h1>
      <p id="bookingMeta">
      </p>
     </div>
    </div>
   </div>
  </header>
  <main class="section-space">
   <div class="container booking-layout">
    <section class="seat-panel">
     <div class="screen">
      SCREEN
     </div>
     <div class="seat-map" id="seatMap">
     </div>
     <div class="legend-row">
      <span>
       <i class="legend-dot">
       </i>
       Available
      </span>
      <span>
       <i class="legend-dot selected">
       </i>
       Selected
      </span>
      <span>
       <i class="legend-dot occupied">
       </i>
       Occupied
      </span>
     </div>
    </section>
    <aside class="summary-panel">
     <span class="eyebrow">
      Your booking
     </span>
     <h3 id="summaryMovie">
     </h3>
     <div class="summary-row">
      <span>
       Cinema
      </span>
      <strong id="summaryCinema">
      </strong>
     </div>
     <div class="summary-row">
      <span>
       Experience
      </span>
      <strong id="summaryExperience">
      </strong>
     </div>
     <div class="summary-row">
      <span>
       Date
      </span>
      <strong id="summaryDate">
      </strong>
     </div>
     <div class="summary-row">
      <span>
       Time
      </span>
      <strong id="summaryTime">
      </strong>
     </div>
     <div class="summary-row">
      <span>
       Seats
      </span>
      <strong id="selectedSeats">
       None
      </strong>
     </div>
     <div class="summary-total">
      <div>
       <small id="ticketCount">
        0 tickets
       </small>
       <div id="summaryPrice">
       </div>
      </div>
      <strong id="seatTotal">
       EGP 0
      </strong>
     </div>
     <button class="btn btn-gold w-100 mt-4" disabled="" id="continueCheckout">
      Continue to checkout
     </button>
    </aside>
   </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
  </script>
  <script src="js/app.js">
  </script>
 </body>
</html>
